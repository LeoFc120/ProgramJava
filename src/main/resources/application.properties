spring.application.name=backend1

# URL corregida con el nombre exacto de la base de datos
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/backend1-bd
spring.datasource.username=postgres
spring.datasource.password=1234

# Se remueve la línea del dialecto para evitar la advertencia HHH90000025
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true